<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div id="app">
        <div
            class="flex justify-center items-center h-screen bg-[url('https://img.magnific.com/premium-vector/tictactoe-seamless-background-dark-blue-vector-illustration_126267-8257.jpg?semt=ais_hybrid&w=740&q=80')] bg-no-repeat bg-cover bg-center">
            <div>

                <div class="flex flex-col items-center">
                    <button @click="restartGame"
                        class="my-5 text-2xl font-bold bg-blue-500 px-5 py-2 rounded-lg text-gray-100 cursor-pointer hover:scale-105">Restart</button>
                    <div class="grid grid-cols-3 bg-rose-500 p-3 rounded-xl">
                        <div v-for="(row, rowIndex) in boardCells" :key="rowIndex">
                            <div v-for="(cell, colIndex) in row" :key="colIndex"
                                class="w-20 h-20 m-4 bg-rose-200 rounded-lg cursor-pointer flex justify-center items-center"
                                @click="cellClicked(rowIndex, colIndex)"
                                :class="{'text-red-500 font-bold text-3xl':cell === 'X', 'text-blue-500 font-bold text-3xl':cell ==='O'}">
                                {{cell}}

                            </div>

                        </div>

                    </div>

                </div>
                <p class=" text-center mt-10 font-bold text-gray-300 text-3xl">{{message}}</p>

            </div>
        </div>


    </div>

    <script>
        Vue.createApp({
            data() {
                return {

                    boardCells: [
                        ["", "", ""],
                        ["", "", ""],
                        ["", "", ""]
                    ],

                    message: "Player X turn",
                    currentPlayer: "X",
                    winner: null
                }
            },
            methods: {
                cellClicked(row, col) {
                    if (this.boardCells[row][col] === "") {
                        this.boardCells[row][col] = this.currentPlayer;

                        if (this.isWinner(this.currentPlayer)) {
                            this.message = `Player${this.currentPlayer} win!`;
                        } else if (this.isDraw(this.currentPlayer)) {
                            this.message = `Draw!`
                        } else {
                            if (this.currentPlayer === 'X') {
                                this.currentPlayer = 'O';
                                this.message = "Player O's turn"

                            } else {
                                this.currentPlayer = 'X';
                                this.message = "Player X's turn"
                            }
                        }
                    }
                },

                isWinner(user) {
                    for (let row = 0; row < this.boardCells.length; row++) {
                        if (this.boardCells[row][0] == user
                            && this.boardCells[row][1] == user
                            && this.boardCells[row][2] == user) {
                            return true;
                        }
                    }

                    for (let col = 0; col < this.boardCells.length; col++) {
                        if (this.boardCells[0][col] == user
                            && this.boardCells[1][col] == user
                            && this.boardCells[2][col] == user) {
                            return true;

                        }
                    }
                    if (this.boardCells[0][0] == user
                        && this.boardCells[1][1] == user
                        && this.boardCells[2][2] == user) {
                        return true;

                    }
                    if (this.boardCells[0][2] == user
                        && this.boardCells[1][1] == user
                        && this.boardCells[2][0] == user) {
                        return true;
                    }
                    return false;
                },

                restartGame() {

                    this.boardCells = [
                        ["", "", ""],
                        ["", "", ""],
                        ["", "", ""]
                    ];

                    this.message = "Player X turn";
                    this.currentPlayer = "X";
                    this.winner = null

                },

                isDraw() {
                    for (let row = 0; row < this.boardCells.length; row++) {
                        for (let col = 0; col < this.boardCells.length; col++) {
                            if (this.boardCells[row][col] === '') {
                                return false;

                            }
                        }
                    }
                    return !this.isWinner('X') && !this.isWinner('O');
                },

            }
        }).mount('#app');


    </script>
</body>

</html>
